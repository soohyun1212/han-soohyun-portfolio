name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_PUBLIC_BASE_PATH: /han-soohyun-portfolio
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - name: Set readable Korean PDF titles in published files
        run: |
          python3 -m venv /tmp/portfolio-pdf-metadata
          /tmp/portfolio-pdf-metadata/bin/pip install --quiet "PyMuPDF==1.26.5"
          /tmp/portfolio-pdf-metadata/bin/python scripts/set-pdf-titles.py out/documents
      - name: Verify static export
        run: test -f out/index.html && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
